---
name: Lint
on:
  pull_request:
    branches: [hello-kind]
  push:
    branches: [hello-kind]

jobs:
  check-renovate-config-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: konflux-ci/renovate-config-validator-action@078d8d5e483879bcb260de0f717be30b59df010c  # main
        with:
          config_file: .github/renovate.json
