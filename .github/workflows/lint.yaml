---
name: Lint
on:
  pull_request:
    branches: [hello-kind]
  push:
    branches: [hello-kind]

jobs:
  check-renovate-config-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: konflux-ci/renovate-config-validator-action@078d8d5e483879bcb260de0f717be30b59df010c  # main
        with:
          config_file: .github/renovate.json
